name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore gvas.sln
      - run: dotnet publish GvasConverter/GvasConverter.csproj -c Release -r win-x64 --self-contained
      - uses: actions/upload-artifact@v4
        with:
          name: gvas-converter-win
          path: GvasConverter/bin/Release/net8.0/win-x64/publish/
